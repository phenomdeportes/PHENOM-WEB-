<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phenom | Tienda Oficial</title>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI&family=Montserrat:wght@400;700;900&family=Oswald:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* --- RESET Y VARIABLES --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* TRANSICIÓN DE PANTALLA (PUNTO 2) */
        body { overflow-x: hidden; background: #fff; transition: margin-right 0.3s ease, margin-left 0.3s ease; }
        body.panel-active { margin-left: -350px; margin-right: 350px; }

        /* --- BARRA SUPERIOR --- */
        .top-bar { background-color: #000; color: #fff; text-align: center; padding: 10px; font-size: 11px; font-weight: bold; letter-spacing: 1.5px; text-transform: uppercase; }

        /* --- HEADER PRINCIPAL --- */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 40px; background: #fff; border-bottom: 1px solid #eaeaea; }
        .logo-container img { height: 45px; cursor: pointer; }
        .nav-links { display: flex; gap: 25px; align-items: center; }
        .nav-links a { text-decoration: none; color: #000; font-weight: 700; font-size: 13px; text-transform: uppercase; cursor: pointer; }
        .nav-links a:hover { text-decoration: underline; }
        .header-icons { display: flex; align-items: center; gap: 20px; }
        .search-box { background: #f0f0f0; border: none; padding: 10px 15px; border-radius: 4px; font-size: 13px; outline: none; }

        /* --- VISTAS SPA --- */
        .page-view { display: none; min-height: 70vh; padding: 40px; }
        .page-view.active-view { display: block; }

        /* --- HERO SECTION --- */
        .hero-grid { display: grid; grid-template-columns: repeat(3, 1fr); height: 85vh; }
        .hero-col { position: relative; background-color: #111; background-size: cover; background-position: center; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; color: #fff; }
        .hero-col::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.3); }
        .hero-content { position: relative; z-index: 1; padding: 20px; }
        .hero-title { font-size: 2.8rem; font-weight: 900; text-transform: uppercase; margin-bottom: 10px; }
        .btn-comprar { background: #fff; color: #000; padding: 15px 30px; font-weight: 900; text-decoration: none; text-transform: uppercase; cursor: pointer; }

        /* --- CATÁLOGO --- */
        .catalog-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 2px solid #000; padding-bottom: 10px; }
        .catalog-title { font-size: 2rem; font-weight: 900; text-transform: uppercase; }
        
        .btn-add-product-top {
            background: #28a745; color: #fff; border: none; padding: 10px 20px;
            font-weight: bold; border-radius: 4px; cursor: pointer; display: none;
        }
        body.admin-mode .btn-add-product-top { display: block; }

        .catalog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
        .product-card { border: 1px solid #eaeaea; padding: 15px; border-radius: 8px; text-align: center; }
        .product-card img { max-width: 100%; height: 200px; object-fit: contain; margin-bottom: 15px; }
        .price { font-size: 1.2rem; font-weight: 900; color: #d4af37; margin: 10px 0; }

        /* --- PANEL CONTROL OMEGA (DERECHA) --- */
        #admin-panel { 
            position: fixed; top: 0; right: -350px; width: 350px; height: 100vh; 
            background: #111; color: #fff; border-left: 2px solid #d4af37; 
            padding: 20px; z-index: 9999; overflow-y: auto; transition: right 0.3s ease; 
        }
        #admin-panel.active { right: 0; }
        .admin-header { font-weight: 900; color: #d4af37; margin-bottom: 20px; display: flex; justify-content: space-between; }
        .admin-group { margin-bottom: 15px; }
        .admin-group label { display: block; font-size: 11px; color: #aaa; margin-bottom: 5px; }
        .admin-group input, .admin-group select { width: 100%; padding: 10px; background: #222; border: 1px solid #444; color: #fff; border-radius: 4px; outline: none; }
        
        /* BARRA DE EMOJIS (PUNTO 4) */
        .emoji-bar { background: #222; padding: 5px; border-radius: 4px; display: flex; gap: 5px; margin-bottom: 15px; overflow-x: auto; border: 1px solid #444; }
        .emoji-btn { background: none; border: none; font-size: 16px; cursor: pointer; transition: transform 0.2s; }
        .emoji-btn:hover { transform: scale(1.2); }

        .btn-save { background: #d4af37; color: #000; width: 100%; padding: 15px; font-weight: 900; border: none; cursor: pointer; border-radius: 4px; }
        .btn-close { background: #dc3545; color: #fff; border: none; padding: 5px 10px; cursor: pointer; border-radius: 4px; }

        /* FOOTER */
        .footer { background-color: #f8f9fa; padding: 40px; text-align: center; border-top: 1px solid #eaeaea; font-weight: bold; }
    </style>
</head>
<body>

    <div class="top-bar" id="fub-bar">SPONSOR OFICIAL DE LA FEDERACIÓN URUGUAYA DE BOXEO (FUB)</div>

    <header class="header">
        <div class="logo-container">
            <!-- 5 clics aquí para el panel -->
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/20/Adidas_Logo.svg/2560px-Adidas_Logo.svg.png" alt="Logo" id="logo-trigger" onclick="showHomePage()">
        </div>
        <nav class="nav-links" id="main-nav-links">
            <a onclick="navigateToCategory('PROTECTORES')">PROTECTORES</a>
            <a onclick="navigateToCategory('ACCESORIOS')">ACCESORIOS</a>
            <a onclick="navigateToCategory('TINAS')">TINAS RECUPERACIÓN</a>
            <a onclick="navigateToCategory('WAVEROLLERS')">WAVEROLLERS</a>
        </nav>
        <div class="header-icons">
            <input type="text" class="search-box" placeholder="Buscar...">
            <span style="font-weight:bold;">🛒 <span id="cart-count">0</span></span>
        </div>
    </header>

    <!-- VISTA INICIO -->
    <div id="view-home" class="page-view active-view" style="padding:0; min-height: auto;">
        <section class="hero-grid">
            <div class="hero-col" style="background-image: url('https://images.unsplash.com/photo-1549719386-74dfcbf7dbed?q=80&w=800');">
                <div class="hero-content">
                    <h1 class="hero-title" id="hero-title-1">PHENOM ELITE</h1>
                    <a onclick="navigateToCategory('PROTECTORES')" class="btn-comprar">VER CATÁLOGO</a>
                </div>
            </div>
            <div class="hero-col" style="background-image: url('https://images.unsplash.com/photo-1596356453261-0d265eb26d43?q=80&w=800');">
                <div class="hero-content"><h1 class="hero-title" id="hero-title-2">THE ORIGINAL</h1></div>
            </div>
            <div class="hero-col" style="background-image: url('https://images.unsplash.com/photo-1517438322307-e67111335449?q=80&w=800');">
                <div class="hero-content"><h1 class="hero-title" id="hero-title-3">RECUPERACIÓN</h1></div>
            </div>
        </section>
    </div>

    <!-- VISTA DINÁMICA DE CATEGORÍAS (PESTAÑAS EN BLANCO) -->
    <div id="view-catalog" class="page-view">
        <div class="catalog-header">
            <h1 class="catalog-title" id="catalog-title-display">CATÁLOGO</h1>
            <!-- Este botón solo aparece cuando abres el panel Omega -->
            <button class="btn-add-product-top" onclick="alert('Abriendo creador de producto...')">+ NUEVO PRODUCTO</button>
        </div>
        <div class="catalog-grid" id="catalog-grid-container">
            <!-- Los productos se inyectan aquí. Si está vacío, queda en blanco. -->
        </div>
    </div>

    <footer class="footer" id="main-footer">
        Phenom Deportes Uruguay © 2026 | Envíos a todo el país.
    </footer>

    <!-- PANEL OMEGA -->
    <div id="admin-panel">
        <div class="admin-header">
            <span>MÓDULO OMEGA</span>
            <button class="btn-close" onclick="toggleAdminMode(false)">X</button>
        </div>

        <div class="admin-group">
            <label>Teclado Rápido Emojis (Toca un input primero)</label>
            <div class="emoji-bar">
                <button type="button" class="emoji-btn" onclick="insertEmoji('🥊')">🥊</button>
                <button type="button" class="emoji-btn" onclick="insertEmoji('🧊')">🧊</button>
                <button type="button" class="emoji-btn" onclick="insertEmoji('🔥')">🔥</button>
                <button type="button" class="emoji-btn" onclick="insertEmoji('⚡')">⚡</button>
                <button type="button" class="emoji-btn" onclick="insertEmoji('🛒')">🛒</button>
                <button type="button" class="emoji-btn" onclick="insertEmoji('✅')">✅</button>
            </div>
        </div>

        <div class="admin-group">
            <label>Mensaje Barra Superior (FUB)</label>
            <input type="text" id="edit-fub-text">
        </div>

        <div class="admin-group">
            <label>Título Columna 1</label>
            <input type="text" id="edit-hero-1">
        </div>

        <button class="btn-save" onclick="saveSettings()">GUARDAR CAMBIOS</button>
    </div>

    <script>
        // 1. GESTIÓN DE PESTAÑAS Y VISTAS BLANCAS
        function showHomePage() {
            document.getElementById('view-catalog').classList.remove('active-view');
            document.getElementById('view-home').classList.add('active-view');
        }

        function navigateToCategory(category) {
            document.getElementById('view-home').classList.remove('active-view');
            document.getElementById('view-catalog').classList.add('active-view');
            document.getElementById('catalog-title-display').innerText = category;
            
            const grid = document.getElementById('catalog-grid-container');
            grid.innerHTML = ''; // Limpia la vista para dejarla en blanco esperando nuevos productos
            
            if (category === 'PROTECTORES') {
                grid.innerHTML = `<div class="product-card"><h3>Guantes Pro</h3><p class="price">$2.250</p></div>`;
            }
            if (category === 'WAVEROLLERS') {
                grid.innerHTML = `<p style="grid-column: 1/-1; color:#666;">No hay WaveRollers cargados aún. Abre el Panel Omega para agregar stock.</p>`;
            }
        }

        // 2. ACTIVACIÓN PANEL OMEGA (Desplazamiento)
        let clickCount = 0; let clickTimer;
        document.getElementById('logo-trigger').addEventListener('click', () => {
            clickCount++; clearTimeout(clickTimer);
            if (clickCount === 5) { toggleAdminMode(true); clickCount = 0; } 
            else { clickTimer = setTimeout(() => { clickCount = 0; }, 1500); }
        });

        function toggleAdminMode(state) {
            const panel = document.getElementById('admin-panel');
            if (state) {
                panel.classList.add('active');
                document.body.classList.add('admin-mode', 'panel-active');
                
                // Cargar datos al panel
                document.getElementById('edit-fub-text').value = document.getElementById('fub-bar').innerText;
                document.getElementById('edit-hero-1').value = document.getElementById('hero-title-1').innerText;
            } else {
                panel.classList.remove('active');
                document.body.classList.remove('admin-mode', 'panel-active');
            }
        }

        // 3. MOTOR DE EMOJIS NATIVO
        let lastFocusedInput = null;
        document.addEventListener('focusin', function(e) {
            if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
                lastFocusedInput = e.target;
            }
        });

        function insertEmoji(emoji) {
            if(lastFocusedInput) {
                const start = lastFocusedInput.selectionStart;
                const end = lastFocusedInput.selectionEnd;
                const text = lastFocusedInput.value;
                lastFocusedInput.value = text.slice(0, start) + emoji + text.slice(end);
                lastFocusedInput.focus();
                lastFocusedInput.selectionStart = lastFocusedInput.selectionEnd = start + emoji.length;
            } else {
                alert("Primero haz clic en un cuadro de texto para insertar el emoji.");
            }
        }

        // 4. GUARDADO
        function saveSettings() {
            document.getElementById('fub-bar').innerText = document.getElementById('edit-fub-text').value;
            document.getElementById('hero-title-1').innerText = document.getElementById('edit-hero-1').value;
            alert("¡Cambios guardados localmente!");
            toggleAdminMode(false);
        }
    </script>
</body>
</html>
