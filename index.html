<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Etiqueta Viewport Crítica -->
    <title>Phenom Uruguay | E-Commerce Omega</title>
    <style>
        /* --- VARIABLES Y RESET --- */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f4f4f4; color: #111; overflow-x: hidden; }
        
        /* --- HEADER Y NAVEGACIÓN --- */
        .fub-bar { background: #002266; color: #fff; text-align: center; padding: 8px; font-size: 11px; font-weight: bold; text-transform: uppercase; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 40px; background: #111; color: #fff; border-bottom: 2px solid #d4af37; }
        .logo-container img { height: 45px; cursor: pointer; transition: height 0.3s; }
        .nav-links { display: flex; gap: 20px; background: #222; padding: 15px; justify-content: center; }
        .nav-links a { color: #fff; text-decoration: none; font-weight: bold; font-size: 13px; text-transform: uppercase; cursor: pointer; }
        .nav-links a:hover { color: #d4af37; }

        /* --- HERO (3 COLUMNAS) --- */
        .hero-grid { display: grid; grid-template-columns: repeat(3, 1fr); min-height: 60vh; }
        .hero-col { position: relative; background-size: cover; background-position: center; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #fff; text-align: center; padding: 20px; border-right: 1px solid #333; }
        .hero-col::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
        .hero-content { position: relative; z-index: 1; }
        .hero-title { font-size: 2rem; font-weight: 900; margin-bottom: 10px; text-transform: uppercase; }
        .hero-sub { font-size: 1.2rem; font-weight: bold; color: #d4af37; }

        /* --- PANEL DE EDICIÓN OMEGA (OCULTO) --- */
        #admin-panel { display: none; position: fixed; top: 0; right: 0; width: 350px; height: 100vh; background: #181818; color: #fff; border-left: 2px solid #d4af37; padding: 20px; z-index: 9999; overflow-y: auto; box-shadow: -5px 0 15px rgba(0,0,0,0.5); }
        #admin-panel.active { display: block; }
        .admin-header { font-weight: 900; font-size: 16px; margin-bottom: 20px; color: #d4af37; border-bottom: 1px solid #333; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .admin-group { margin-bottom: 15px; background: #252525; padding: 12px; border-radius: 6px; }
        .admin-group label { display: block; font-size: 11px; font-weight: bold; margin-bottom: 5px; color: #aaa; text-transform: uppercase; }
        .admin-group input[type="text"], .admin-group input[type="number"] { width: 100%; padding: 8px; border: 1px solid #444; border-radius: 4px; background: #111; color: #fff; font-size: 12px; }
        .admin-group input[type="file"] { font-size: 11px; color: #ccc; }
        .btn-save { background: #d4af37; color: #000; width: 100%; padding: 12px; border: none; font-weight: 900; cursor: pointer; text-transform: uppercase; margin-top: 10px; border-radius: 4px; }
        .btn-close { background: #e00; color: #fff; border: none; padding: 4px 8px; cursor: pointer; font-weight: bold; border-radius: 3px; }

        /* --- ADAPTABILIDAD MÓVIL (MEDIA QUERIES) --- */
        @media (max-width: 768px) {
            .header { padding: 15px 20px; flex-direction: column; gap: 10px; }
            .nav-links { flex-direction: column; align-items: center; gap: 15px; }
            .hero-grid { grid-template-columns: 1fr; }
            .hero-col { min-height: 350px; border-right: none; border-bottom: 1px solid #333; }
            #admin-panel { width: 100%; border-left: none; }
        }
    </style>
</head>
<body>

    <div class="fub-bar" id="fub-bar-text">SPONSOR OFICIAL DE LA FEDERACIÓN URUGUAYA DE BOXEO (FUB)</div>

    <header class="header" id="main-header">
        <div class="logo-container">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/20/Adidas_Logo.svg/2560px-Adidas_Logo.svg.png" alt="Logo" id="logo-trigger">
        </div>
        <div style="font-weight: bold; font-size: 14px;">🛒 Carrito: 0</div>
    </header>

    <nav class="nav-links">
        <a>GUANTES</a>
        <a>PROTECTORES</a>
        <a>INDUMENTARIA</a>
        <a>TINAS</a>
        <a>SALE</a>
    </nav>

    <section class="hero-grid">
        <div class="hero-col" id="col-1-bg" style="background-image: url('https://via.placeholder.com/800x600/111/fff?text=COLUMNA+1');">
            <div class="hero-content">
                <h1 class="hero-title" id="col-1-title">PHENOM ELITE</h1>
                <h2 class="hero-sub" id="col-1-sub">MÁXIMA PROTECCIÓN</h2>
            </div>
        </div>
        <div class="hero-col" id="col-2-bg" style="background-image: url('https://via.placeholder.com/800x600/222/fff?text=COLUMNA+2');">
            <div class="hero-content">
                <h1 class="hero-title" id="col-2-title">THE ORIGINAL</h1>
                <h2 class="hero-sub" id="col-2-sub"></h2>
            </div>
        </div>
        <div class="hero-col" id="col-3-bg" style="background-image: url('https://via.placeholder.com/800x600/333/fff?text=COLUMNA+3');">
            <div class="hero-content">
                <h1 class="hero-title" id="col-3-title">SPARRING PRO</h1>
                <h2 class="hero-sub" id="col-3-sub">ONZAS PRECISAS</h2>
            </div>
        </div>
    </section>

    <!-- PANEL OMEGA -->
    <div id="admin-panel">
        <div class="admin-header">
            CONTROL OMEGA
            <button class="btn-close" onclick="document.getElementById('admin-panel').classList.remove('active')">X</button>
        </div>

        <div class="admin-group">
            <label>Tamaño del Logo (px)</label>
            <input type="number" id="edit-logo-size" value="45" oninput="document.getElementById('logo-trigger').style.height = this.value + 'px'">
        </div>

        <div class="admin-group">
            <label>Columna 1: Cargar Imagen (Compresión Auto)</label>
            <input type="file" id="upload-col-1" accept="image/*" onchange="handleImageUpload(event, 'col-1-bg')">
            <label style="margin-top: 10px;">Título Col 1</label>
            <input type="text" id="edit-col-1-title" oninput="document.getElementById('col-1-title').innerText = this.value">
        </div>

        <button class="btn-save" onclick="saveData()">💾 GUARDAR CAMBIOS</button>
    </div>

    <script>
        // --- 1. GATILLO TÁCTICO: 5 CLICS AL LOGO ---
        let clickCount = 0;
        let clickTimer;
        document.getElementById('logo-trigger').addEventListener('click', () => {
            clickCount++;
            clearTimeout(clickTimer);
            if (clickCount === 5) {
                document.getElementById('admin-panel').classList.add('active');
                clickCount = 0; 
            } else {
                clickTimer = setTimeout(() => { clickCount = 0; }, 2000); 
            }
        });

        // --- 2. MOTOR DE COMPRESIÓN DE IMÁGENES (Evita saturar LocalStorage) ---
        function compressImage(file, maxWidth, quality, callback) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    
                    if (width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;
                    }
                    
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    // Retorna Base64 optimizado
                    callback(canvas.toDataURL('image/jpeg', quality));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // --- 3. PROCESAMIENTO Y PREVISUALIZACIÓN DE IMÁGENES ---
        let pendingImages = {};
        function handleImageUpload(event, targetId) {
            const file = event.target.files[0];
            if (!file) return;
            
            // Comprime a un máximo de 800px ancho, calidad 70%
            compressImage(file, 800, 0.7, function(compressedBase64) {
                document.getElementById(targetId).style.backgroundImage = `url('${compressedBase64}')`;
                pendingImages[targetId] = compressedBase64;
            });
        }

        // --- 4. PERSISTENCIA TOTAL (LOCALSTORAGE) ---
        function saveData() {
            const data = {
                logoSize: document.getElementById('edit-logo-size').value,
                col1Title: document.getElementById('edit-col-1-title').value,
                col1Bg: pendingImages['col-1-bg'] || document.getElementById('col-1-bg').style.backgroundImage
            };
            localStorage.setItem('phenom_omega_data', JSON.stringify(data));
            alert('¡Datos y Fotos guardados con éxito!');
        }

        function loadData() {
            const saved = localStorage.getItem('phenom_omega_data');
            if (!saved) return;
            const data = JSON.parse(saved);
            
            if (data.logoSize) {
                document.getElementById('logo-trigger').style.height = data.logoSize + 'px';
                document.getElementById('edit-logo-size').value = data.logoSize;
            }
            if (data.col1Title) {
                document.getElementById('col-1-title').innerText = data.col1Title;
                document.getElementById('edit-col-1-title').value = data.col1Title;
            }
            if (data.col1Bg) {
                document.getElementById('col-1-bg').style.backgroundImage = data.col1Bg.startsWith('url') ? data.col1Bg : `url('${data.col1Bg}')`;
                pendingImages['col-1-bg'] = data.col1Bg;
            }
        }

        window.onload = loadData;
    </script>
</body>
</html>
