<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phenom Uruguay - Tienda Oficial FUB</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --primary-color: #e5b80b;
            --text-color: #111111;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); }

        /* Barra FUB Superior */
        .fub-bar { background: #000; color: #fff; text-align: center; padding: 8px; font-size: 0.85rem; font-weight: bold; letter-spacing: 1px; }

        /* Header Principal */
        header { display: flex; justify-content: space-between; align-items: center; background: #111; padding: 15px 30px; color: white; position: relative; }
        .logo-area { display: flex; align-items: center; gap: 15px; }
        .logo-area img { height: 38px; width: auto; }
        .logo-text { font-family: 'Impact', sans-serif; font-size: 24px; letter-spacing: 7px; color: #fff; }

        /* Menú de Navegación PC */
        nav.pc-nav { display: flex; gap: 20px; }
        nav.pc-nav a { color: white; text-decoration: none; font-weight: 600; font-size: 0.9rem; transition: color 0.2s; }
        nav.pc-nav a:hover { color: var(--primary-color); }

        /* Menú Hamburguesa Celular */
        .hamburger-btn { display: none; background: none; border: none; color: white; font-size: 28px; cursor: pointer; }
        .mobile-menu { display: none; position: absolute; top: 100%
