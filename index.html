<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phenom | Tienda Oficial</title>
    <!-- Importación de Fuentes Tipográficas -->
    <link href="https://fonts.googleapis.com/css2?family=Arial&family=Courier+New&family=Georgia&family=Impact&family=Lucida+Console&family=Palatino&family=Segoe+UI&family=Tahoma&family=Times+New+Roman&family=Verdana&family=Montserrat:wght@400;700;900&family=Oswald:wght@400;700&family=Roboto:wght@400;700;900&family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- Hojas de Estilos Separadas -->
    <link rel="stylesheet" href="styles.css">
    <style>
        /* --- CORRECCIÓN IMAGEN PRODUCTO (SIN BORDES NEGROS) --- */
        .product-card .card-img-wrapper {
            background: #f8f9fa; height: 220px; border-radius: 6px;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; margin-bottom: 15px; position: relative;
            cursor: pointer;
        }
        .product-card .card-img-wrapper img, .product-card .card-img-wrapper video {
            max-width: 90%; max-height: 90%; object-fit: contain; background: transparent; pointer-events: none;
        }
        /* Precio en negro y botón sin negrita */
        .offer-price { color: #000 !important; font-size: 16px; font-weight: 900; }
        .regular-price { text-decoration: line-through; color: #999; font-size: 12px; margin-right: 8px; }
        .btn-add-cart {
            background: #000; color: #fff; text-align: center; padding: 10px;
            border-radius: 6px; font-size: 12px; font-weight: 400 !important; text-transform: uppercase; border: none;
            cursor: pointer; width: 100%; margin-bottom: 8px;
        }
        .btn-add-cart:hover { background: #222; }
    </style>
</head>
<body>

    <!-- BARRA SUPERIOR -->
    <div class="top-bar-container" id="top-bar-wrapper">
        <div class="top-bar" id="fub-bar">¡BIENVENIDOS A LA TIENDA OFICIAL DE PHENOM!</div>
    </div>

    <!-- HEADER / MENÚ DE NAVEGACIÓN -->
    <header class="header" id="main-header">
        <div class="logo-container">
            <img src="logo.png" alt="Logo Phenom" id="logo-trigger">
            <span id="logo-adj-text-val"></span>
        </div>

        <nav class="nav-links" id="main-nav-links">
            <a>PROTECTORES</a>
            <a>ACCESORIOS</a>
            <a>INDUMENTARIA</a>
            <a>RECUPERACIÓN - FRIO/CALOR</a>
            <a class="highlight">SALE</a>
        </nav>

        <div class="header-controls">
            <input type="text" class="search-box" placeholder="Buscar..." oninput="filterCatalogSearch(this.value)">
            <span class="icon" title="Mi Cuenta">👤</span>
            <span class="icon" title="Favoritos">♡</span>
            
            <div class="cart-icon-wrapper" onclick="toggleCartDrawer(true)" title="Ver Carrito de Compras">
                <span class="icon">🛒</span>
                <span id="cart-badge-count" class="cart-badge" style="display:none;">0</span>
            </div>

            <div class="hamburger" onclick="toggleMobileMenu()">☰</div>
        </div>
    </header>

    <!-- VISTA: CATÁLOGO DE PRODUCTOS -->
    <div id="view-catalog" class="page-view active-view">
        <div class="catalog-container" id="catalog-main-bg">
            <div class="catalog-header">
                <div>
                    <h1 class="catalog-title" id="catalog-category-title">CATÁLOGO OFICIAL</h1>
                    <div class="catalog-subtitle" id="catalog-category-subtitle">Equipamiento de alto rendimiento</div>
                </div>
                <!-- BOTÓN PANEL OMEGA PARA CREAR PRODUCTOS -->
                <button class="btn-add-product-top" id="btn-dynamic-add-prod" onclick="openCreateProductModal()">+ Agregar Producto</button>
            </div>
            <div class="catalog-grid" id="catalog-grid-container"></div>
        </div>
    </div>

    <!-- PANEL LATERAL DEL CARRITO -->
    <div id="cart-drawer-overlay" onclick="toggleCartDrawer(false)"></div>
    <div id="cart-drawer">
        <div class="cart-header">
            <div class="cart-header-title"><span>🛒 Tu Carrito</span></div>
            <button class="cart-close-btn" onclick="toggleCartDrawer(false)" title="Cerrar Carrito">✕</button>
        </div>
        <div class="cart-body" id="cart-drawer-body"></div>
        <div class="cart-footer" id="cart-drawer-footer"></div>
    </div>

    <!-- MODAL SELECCIONAR VARIANTE -->
    <div class="simple-modal-overlay" id="variant-modal-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:15000; align-items:center; justify-content:center;">
        <div class="variant-modal-content" style="background:#fff; padding:25px; border-radius:8px; width:90%; max-width:400px; text-align:center; position:relative;">
            <button class="simple-modal-close" onclick="closeVariantModal()" style="position:absolute; top:10px; right:15px; background:none; border:none; font-size:20px; cursor:pointer;">✕</button>
            <div class="simple-modal-title" style="margin-bottom:10px; font-weight:bold;">Seleccionar Variante</div>
            <p id="variant-modal-prod-title" style="font-size:13px; color:#475569; font-weight:700; margin-bottom:15px;"></p>
            <div class="variant-options-grid" id="variant-modal-options" style="display:flex; flex-wrap:wrap; justify-content:center; gap:10px;"></div>
        </div>
    </div>

    <!-- MODAL CARGAR NUEVO PRODUCTO (PANEL OMEGA) -->
    <div class="dark-modal-overlay" id="dark-product-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:20000; align-items:center; justify-content:center;">
        <div class="dark-modal-content" style="background:#222; color:#fff; padding:30px; border-radius:10px; width:90%; max-width:500px; max-height:90vh; overflow-y:auto; position:relative;">
            <button class="simple-modal-close" onclick="closeDarkModal()" style="position:absolute; top:15px; right:20px; background:none; border:none; font-size:24px; color:#fff; cursor:pointer;">✕</button>
            <div class="dark-modal-title" id="dark-modal-title-text" style="color:#d4af37; margin-bottom:20px; font-size:18px; font-weight:bold;">Cargar Nuevo Producto</div>
            
            <input type="hidden" id="dark-prod-id">
            
            <label style="display:block; margin-bottom:5px; font-size:12px;">Título Exacto del Producto</label>
            <input type="text" id="dark-title" placeholder="Ej: Guantes Pro Blanco/Dorado" style="width:100%; padding:10px; margin-bottom:15px; border-radius:4px; border:none; box-sizing:border-box;">
            
            <label style="display:block; margin-bottom:5px; font-size:12px;">Talles / Onzas Disponibles</label>
            <div class="checkboxes-box" style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:15px; background:#111; padding:10px; border-radius:6px;">
                <label><input type="checkbox" value="8oz" class="chk-oz"> 8oz</label>
                <label><input type="checkbox" value="10oz" class="chk-oz"> 10oz</label>
                <label><input type="checkbox" value="12oz" class="chk-oz"> 12oz</label>
                <label><input type="checkbox" value="14oz" class="chk-oz"> 14oz</label>
                <label><input type="checkbox" value="16oz" class="chk-oz"> 16oz</label>
            </div>
            
            <div class="two-cols" style="display:flex; gap:15px; margin-bottom:15px;">
                <div class="simple-group" style="flex:1;">
                    <label style="display:block; margin-bottom:5px; font-size:12px;">Precio Tachado</label>
                    <input type="text" id="dark-reg-price" placeholder="$2.500" style="width:100%; padding:10px; border-radius:4px; border:none; box-sizing:border-box;">
                </div>
                <div class="simple-group" style="flex:1;">
                    <label style="display:block; margin-bottom:5px; font-size:12px; color:#d4af37; font-weight:bold;">Precio Oferta</label>
                    <input type="text" id="dark-price" placeholder="$2.090" style="width:100%; padding:10px; border-radius:4px; border:none; box-sizing:border-box;">
                </div>
            </div>
            
            <button type="button" class="btn-save-gold" onclick="saveDarkProduct()" style="width:100%; padding:15px; background:#d4af37; color:#000; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">GUARDAR PUBLICACIÓN</button>
        </div>
    </div>

    <!-- TUS SCRIPTS ORIGINALES DE DISEÑO -->
    <script src="db.js"></script>
    <script src="app.js"></script>
    <script src="admin.js"></script>

    <!-- MOTOR DE E-COMMERCE BLINDADO OMEGA (Sobrescribe lógica defectuosa de cart.js) -->
    <script>
        // Memoria centralizada de la tienda
        let omegaProducts = [];
        let omegaCart = [];
        let pendingVariantObj = null;

        document.addEventListener('DOMContentLoaded', () => {
            loadOmegaData();
            renderOmegaCatalog();
            updateOmegaBadge();
        });

        function loadOmegaData() {
            const local = localStorage.getItem('phenom_omega_v2');
            if(local) {
                const data = JSON.parse(local);
                omegaProducts = data.omegaProducts || [];
                omegaCart = data.omegaCart || [];
            }
        }

        function saveOmegaData() {
            localStorage.setItem('phenom_omega_v2', JSON.stringify({ omegaProducts, omegaCart }));
        }

        // --- PANEL OMEGA: CARGA CON ID ÚNICO ---
        function openCreateProductModal() {
            document.getElementById('dark-prod-id').value = '';
            document.getElementById('dark-title').value = '';
            document.getElementById('dark-reg-price').value = '';
            document.getElementById('dark-price').value = '';
            document.querySelectorAll('.chk-oz').forEach(c => c.checked = false);
            document.getElementById('dark-product-modal').style.display = 'flex';
        }

        function closeDarkModal() {
            document.getElementById('dark-product-modal').style.display = 'none';
        }

        function saveDarkProduct() {
            const title = document.getElementById('dark-title').value;
            const regPrice = document.getElementById('dark-reg-price').value;
            const offerPrice = document.getElementById('dark-price').value;
            
            if (!title || !offerPrice) { alert("Título y Precio de Oferta obligatorios."); return; }

            const selectedVariants = [];
            document.querySelectorAll('.chk-oz:checked').forEach(c => selectedVariants.push(c.value));

            // MAGIA OMEGA: ID ÚNICO INMUTABLE
            const newProduct = {
                id: 'prod-' + Date.now(),
                title: title,
                variants: selectedVariants,
                regularPrice: regPrice,
                price: offerPrice,
                media: ['https://via.placeholder.com/300x300/111/fff?text=PHENOM'] // Placeholder temporal hasta conectar fotos
            };

            omegaProducts.push(newProduct);
            saveOmegaData();
            closeDarkModal();
            renderOmegaCatalog();
        }

        function renderOmegaCatalog() {
            const container = document.getElementById('catalog-grid-container');
            if(!container) return;
            container.innerHTML = '';

            omegaProducts.forEach(p => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.style.cssText = "border:1px solid #eee; padding:15px; border-radius:8px; margin-bottom:20px;";
                
                let variantsHtml = (p.variants && p.variants.length > 0) ? p.variants.map(v => `<span style="background:#f1f5f9; padding:2px 6px; font-size:10px; border-radius:4px; margin-right:4px;">${v}</span>`).join('') : '';

                card.innerHTML = `
                    <div class="card-img-wrapper"><img src="${p.media[0]}" style="max-width:100%;"></div>
                    <div style="font-weight:700; font-size:15px; margin-bottom:5px;">${p.title}</div>
                    <div style="margin-bottom:10px;">${variantsHtml}</div>
                    <div style="margin-bottom:15px;">
                        ${p.regularPrice ? `<span class="regular-price">${p.regularPrice}</span>` : ''}
                        <span class="offer-price">${p.price}</span>
                    </div>
                    <button class="btn-add-cart" onclick="handleOmegaCartClick('${p.id}')">AGREGAR AL CARRITO</button>
                    <button onclick="deleteOmegaProduct('${p.id}')" style="width:100%; background:#dc3545; color:white; border:none; padding:5px; margin-top:5px; border-radius:4px; cursor:pointer;">🗑 Borrar</button>
                `;
                container.appendChild(card);
            });
        }

        function deleteOmegaProduct(id) {
            omegaProducts = omegaProducts.filter(p => p.id !== id);
            saveOmegaData();
            renderOmegaCatalog();
        }

        // --- LÓGICA DE CARRITO ESTRICTA (POR ID) ---
        function handleOmegaCartClick(productId) {
            const product = omegaProducts.find(p => p.id === productId);
            if (!product) return;

            if (product.variants && product.variants.length > 0) {
                openVariantModal(product);
            } else {
                addToOmegaCart(product, 'Única');
            }
        }

        function openVariantModal(product) {
            pendingVariantObj = product;
            document.getElementById('variant-modal-prod-title').innerText = product.title;
            const container = document.getElementById('variant-modal-options');
            container.innerHTML = '';
            
            product.variants.forEach(v => {
                const btn = document.createElement('button');
                btn.innerText = v;
                btn.style.cssText = "padding:8px 16px; border:1px solid #000; background:#fff; cursor:pointer; border-radius:4px;";
                btn.onclick = () => {
                    closeVariantModal();
                    addToOmegaCart(pendingVariantObj, v);
                };
                container.appendChild(btn);
            });
            document.getElementById('variant-modal-overlay').style.display = 'flex';
        }

        function closeVariantModal() {
            document.getElementById('variant-modal-overlay').style.display = 'none';
            pendingVariantObj = null;
        }

        function addToOmegaCart(product, variant) {
            const priceNum = parseInt(product.price.toString().replace(/[^0-9]/g, '')) || 0;
            const existing = omegaCart.find(item => item.id === product.id && item.variant === variant);
            
            if (existing) {
                existing.quantity += 1;
            } else {
                omegaCart.push({
                    id: product.id,
                    title: product.title, // COPIA EXACTA DEL TÍTULO
                    variant: variant,     // COPIA EXACTA DEL TALLE
                    priceStr: product.price, // COPIA EXACTA DEL PRECIO OFERTA
                    priceNum: priceNum,
                    quantity: 1
                });
            }
            saveOmegaData();
            updateOmegaBadge();
            renderOmegaDrawer();
            toggleCartDrawer(true);
        }

        function toggleCartDrawer(open) {
            document.getElementById('cart-drawer').style.right = open ? '0' : '-400px';
            document.getElementById('cart-drawer-overlay').style.display = open ? 'block' : 'none';
        }

        function updateOmegaBadge() {
            const count = omegaCart.reduce((sum, item) => sum + item.quantity, 0);
            const badge = document.getElementById('cart-badge-count');
            if(badge) {
                badge.innerText = count;
                badge.style.display = count > 0 ? 'flex' : 'none';
            }
        }

        function renderOmegaDrawer() {
            const body = document.getElementById('cart-drawer-body');
            const footer = document.getElementById('cart-drawer-footer');
            
            if (omegaCart.length === 0) {
                body.innerHTML = `<p style="text-align:center; color:#666; margin-top:40px;">Tu carrito está vacío</p>`;
                footer.style.display = 'none';
                return;
            }

            footer.style.display = 'block';
            let html = '';
            let subtotal = 0;

            omegaCart.forEach((item, index) => {
                const itemTotal = item.priceNum * item.quantity;
                subtotal += itemTotal;
                html += `
                    <div style="font-size:13px; margin-bottom:15px; border-bottom:1px solid #eee; padding-bottom:10px;">
                        <strong>${item.title}</strong><br>
                        Opción: <strong>${item.variant}</strong> | Cant: ${item.quantity}<br>
                        <span style="color:#000; font-weight:bold;">$${itemTotal.toLocaleString('es-UY')} UYU</span>
                        <button onclick="removeOmegaCart(${index})" style="color:red; background:none; border:none; cursor:pointer; float:right;">✕</button>
                    </div>
                `;
            });

            body.innerHTML = html;
            footer.innerHTML = `
                <div style="display:flex; justify-content:space-between; margin-bottom:15px; font-weight:bold;">
                    <span>TOTAL:</span>
                    <span>$${subtotal.toLocaleString('es-UY')} UYU</span>
                </div>
                <button onclick="checkoutOmegaWhatsApp()" style="width:100%; background:#25D366; color:#fff; border:none; padding:15px; border-radius:6px; font-weight:bold; cursor:pointer;">
                    Comprar vía WhatsApp ✆
                </button>
            `;
        }

        function removeOmegaCart(index) {
            omegaCart.splice(index, 1);
            saveOmegaData();
            updateOmegaBadge();
            renderOmegaDrawer();
        }

        function checkoutOmegaWhatsApp() {
            if (omegaCart.length === 0) return;
            let itemsText = '';
            let total = 0;
            omegaCart.forEach(item => {
                total += (item.priceNum * item.quantity);
                itemsText += `• *${item.title}* (${item.variant}) x${item.quantity} - ${item.priceStr}\n`;
            });
            const msg = `¡Hola PHENOM! 👋 Quiero realizar este pedido:\n\n${itemsText}\n💰 *TOTAL:* $${total.toLocaleString('es-UY')} UYU\n\nQuedo a la espera.`;
            window.open(`https://wa.me/59893418239?text=${encodeURIComponent(msg)}`, '_blank');
        }
    </script>
</body>
</html>
