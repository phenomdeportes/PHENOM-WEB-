<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phenom Uruguay | E-Commerce Omega</title>
    <style>
        /* --- RESET Y VARIABLES --- */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f4f4f4; color: #111; overflow-x: hidden; transition: margin-left 0.3s ease; margin-left: 0; }
        
        /* DESPLAZAMIENTO DEL PANEL IZQUIERDO */
        body.admin-mode { margin-left: 350px; }
        
        /* --- VISIBILIDAD CONTROLADA --- */
        .admin-only { display: none !important; }
        body.admin-mode .admin-only { display: block !important; }
        body.admin-mode .admin-flex { display: flex !important; }

        /* --- HEADER Y NAVEGACIÓN --- */
        .fub-bar { background: #002266; color: #fff; text-align: center; padding: 8px; font-size: 11px; font-weight: bold; text-transform: uppercase; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 40px; background: #111; color: #fff; border-bottom: 2px solid #d4af37; transition: padding 0.2s; }
        .logo-container img { height: 45px; max-height: 80px; cursor: pointer; transition: height 0.3s; object-fit: contain; }
        
        .nav-links { display: flex; gap: 20px; background: #222; padding: 15px; justify-content: center; }
        .nav-links button { background: none; border: none; color: #fff; font-weight: bold; font-size: 13px; text-transform: uppercase; cursor: pointer; transition: color 0.2s; }
        .nav-links button:hover, .nav-links button.active { color: #d4af37; border-bottom: 2px solid #d4af37; }

        /* --- VISTAS SPA --- */
        .page-view { display: none; padding: 40px 20px; max-width: 1200px; margin: 0 auto; min-height: 60vh; }
        .page-view.active-view { display: block; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid #ddd; padding-bottom: 10px; }
        .page-title { font-size: 2rem; font-weight: 900; text-transform: uppercase; }
        .page-subtitle { font-size: 1rem; color: #666; margin-top: 5px; }
        
        /* BOTÓN NUEVO PRODUCTO */
        .btn-add-product { background: #28a745; color: #fff; border: none; padding: 10px 20px; font-weight: 900; border-radius: 4px; cursor: pointer; text-transform: uppercase; }
        
        /* --- GRILLA DE PRODUCTOS --- */
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .product-card { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 15px; display: flex; flex-direction: column; }
        .product-img { width: 100%; height: 200px; object-fit: contain; margin-bottom: 10px; background: #f9f9f9; border-radius: 4px; }
        .product-title { font-weight: bold; font-size: 14px; margin-bottom: 5px; }
        .product-price { color: #d4af37; font-weight: 900; font-size: 18px; margin-bottom: 10px; }
        .product-sizes { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; }
        .size-badge { background: #eee; font-size: 10px; padding: 3px 6px; border-radius: 3px; font-weight: bold; }

        /* --- PANEL DE EDICIÓN OMEGA (IZQUIERDA) --- */
        #admin-panel { position: fixed; top: 0; left: -350px; width: 350px; height: 100vh; background: #181818; color: #fff; border-right: 2px solid #d4af37; padding: 20px; z-index: 9999; overflow-y: auto; box-shadow: 5px 0 15px rgba(0,0,0,0.5); transition: left 0.3s ease; }
        body.admin-mode #admin-panel { left: 0; }
        
        .admin-header { font-weight: 900; font-size: 16px; margin-bottom: 20px; color: #d4af37; border-bottom: 1px solid #333; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .admin-section { background: #252525; padding: 15px; border-radius: 6px; margin-bottom: 15px; }
        .admin-section h3 { font-size: 12px; text-transform: uppercase; color: #aaa; margin-bottom: 10px; border-bottom: 1px solid #444; padding-bottom: 5px; }
        .admin-group { margin-bottom: 12px; }
        .admin-group label { display: block; font-size: 11px; font-weight: bold; margin-bottom: 5px; color: #ccc; }
        .admin-group input, .admin-group select { width: 100%; padding: 8px; border: 1px solid #444; border-radius: 4px; background: #111; color: #fff; font-size: 12px; }
        
        .btn-save { background: #d4af37; color: #000; width: 100%; padding: 12px; border: none; font-weight: 900; cursor: pointer; text-transform: uppercase; margin-top: 10px; border-radius: 4px; }
        .btn-close { background: #e00; color: #fff; border: none; padding: 4px 8px; cursor: pointer; font-weight: bold; border-radius: 3px; }

        /* --- MODAL NUEVO PRODUCTO --- */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 10000; justify-content: center; align-items: center; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: #fff; padding: 25px; width: 400px; border-radius: 8px; border: 2px solid #d4af37; max-height: 90vh; overflow-y: auto; }
        .modal-content h2 { font-size: 18px; margin-bottom: 15px; text-transform: uppercase; font-weight: 900; }
        .modal-group { margin-bottom: 15px; }
        .modal-group label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 5px; }
        .modal-group input[type="text"] { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .checkbox-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
        .checkbox-grid label { font-size: 11px; font-weight: normal; display: flex; align-items: center; gap: 4px; }
        .btn-action { background: #000; color: #fff; width: 100%; padding: 12px; border: none; font-weight: 900; cursor: pointer; border-radius: 4px; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="fub-bar" id="fub-bar-text">SPONSOR OFICIAL DE LA FEDERACIÓN URUGUAYA DE BOXEO (FUB)</div>

    <header class="header" id="main-header">
        <div class="logo-container" title="5 clics para Módulo Omega">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/20/Adidas_Logo.svg/2560px-Adidas_Logo.svg.png" alt="Logo" id="logo-trigger">
        </div>
        <div style="font-weight: bold; font-size: 14px;">🛒 Carrito: <span id="cart-count">0</span></div>
    </header>

    <nav class="nav-links" id="main-nav">
        <!-- Generado dinámicamente -->
    </nav>

    <!-- CONTENEDOR DE PÁGINAS -->
    <main id="app-content">
        <!-- Vistas inyectadas dinámicamente -->
    </main>

    <!-- PANEL OMEGA (IZQUIERDA) -->
    <div id="admin-panel">
        <div class="admin-header">
            MÓDULO OMEGA
            <button class="btn-close" onclick="toggleAdminMode(false)">X</button>
        </div>

        <div class="admin-section">
            <h3>Identidad Global</h3>
            <div class="admin-group">
                <label>Tamaño del Logo (px)</label>
                <input type="range" id="edit-logo-size" min="30" max="80" value="45" oninput="adjustHeader()">
            </div>
        </div>

        <div class="admin-section">
            <h3>Gestor de Pestañas</h3>
            <div class="admin-group">
                <label>Seleccionar Pestaña</label>
                <select id="tab-selector" onchange="loadTabSettings()">
                    <!-- Opciones generadas en JS -->
                </select>
            </div>
            <div class="admin-group">
                <label>Nombre de la Pestaña</label>
                <input type="text" id="edit-tab-name">
            </div>
            <div class="admin-group">
                <label>Título de la Página</label>
                <input type="text" id="edit-page-title">
            </div>
            <div class="admin-group">
                <label>Subtítulo de la Página</label>
                <input type="text" id="edit-page-subtitle">
            </div>
            <div class="admin-group">
                <label>Diseño de Grilla</label>
                <select id="edit-page-layout">
                    <option value="cards">Tarjetas (Cards)</option>
                    <option value="list">Lista (List)</option>
                </select>
            </div>
        </div>

        <button class="btn-save" onclick="saveAllSettings()">💾 GUARDAR CAMBIOS</button>
    </div>

    <!-- MODAL NUEVO PRODUCTO -->
    <div class="modal-overlay" id="product-modal">
        <div class="modal-content">
            <h2 id="modal-title">Nuevo Producto</h2>
            <input type="hidden" id="prod-category">
            
            <div class="modal-group">
                <label>Título del Producto</label>
                <input type="text" id="prod-title" placeholder="Ej: Guantes Pro 14oz">
            </div>
            <div class="modal-group">
                <label>Precio (UYU)</label>
                <input type="text" id="prod-price" placeholder="$2.250">
            </div>
            <div class="modal-group">
                <label>Foto (Se comprime automáticamente)</label>
                <input type="file" id="prod-img-file" accept="image/*">
            </div>
            <div class="modal-group">
                <label>Talles / Onzas Disponibles</label>
                <div class="checkbox-grid">
                    <label><input type="checkbox" class="size-chk" value="S"> S</label>
                    <label><input type="checkbox" class="size-chk" value="M"> M</label>
                    <label><input type="checkbox" class="size-chk" value="L"> L</label>
                    <label><input type="checkbox" class="size-chk" value="XL"> XL</label>
                    <label><input type="checkbox" class="size-chk" value="8oz"> 8oz</label>
                    <label><input type="checkbox" class="size-chk" value="10oz"> 10oz</label>
                    <label><input type="checkbox" class="size-chk" value="12oz"> 12oz</label>
                    <label><input type="checkbox" class="size-chk" value="14oz"> 14oz</label>
                    <label><input type="checkbox" class="size-chk" value="16oz"> 16oz</label>
                </div>
            </div>
            
            <button class="btn-action" onclick="saveProduct()">GUARDAR PRODUCTO</button>
            <button class="btn-action" style="background:#e00; margin-top:5px;" onclick="closeProductModal()">CANCELAR</button>
        </div>
    </div>

    <script>
        // --- 1. ESTRUCTURA DE DATOS BASE ---
        let siteData = JSON.parse(localStorage.getItem('phenom_omega_data')) || {
            categories: [
                { id: 'inicio', name: 'INICIO', title: 'DESTACADOS PHENOM', subtitle: 'Equipamiento de alto rendimiento.', layout: 'cards' },
                { id: 'guantes', name: 'GUANTES', title: 'GUANTES DE BOXEO', subtitle: 'Sparring y competición.', layout: 'cards' },
                { id: 'protectores', name: 'PROTECTORES', title: 'CABEZALES Y TIBIALES', subtitle: 'Máxima absorción de impacto.', layout: 'cards' }
            ],
            products: []
        };

        // --- 2. GATILLO TÁCTICO: 5 CLICS AL LOGO ---
        let clickCount = 0; let clickTimer;
        document.getElementById('logo-trigger').addEventListener('click', () => {
            clickCount++; clearTimeout(clickTimer);
            if (clickCount === 5) { toggleAdminMode(true); clickCount = 0; } 
            else { clickTimer = setTimeout(() => { clickCount = 0; }, 2000); }
        });

        function toggleAdminMode(forceState) {
            if (forceState) {
                document.body.classList.add('admin-mode');
                renderAdminTabs();
            } else {
                document.body.classList.remove('admin-mode');
            }
        }

        // --- 3. COMPRESOR DE IMÁGENES NATIVO ---
        function compressImage(file, callback) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width; let height = img.height;
                    const maxDim = 800; // Resolución máxima segura
                    
                    if (width > maxDim || height > maxDim) {
                        if (width > height) { height = Math.round((height * maxDim) / width); width = maxDim; } 
                        else { width = Math.round((width * maxDim) / height); height = maxDim; }
                    }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', 0.7)); // 70% calidad
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // --- 4. RENDERIZADO DEL FRONT-END ---
        function renderNavigation() {
            const nav = document.getElementById('main-nav');
            nav.innerHTML = '';
            siteData.categories.forEach(cat => {
                nav.innerHTML += `<button onclick="switchTab('${cat.id}')" id="nav-btn-${cat.id}">${cat.name}</button>`;
            });
        }

        function switchTab(categoryId) {
            // Actualizar botones activos
            document.querySelectorAll('.nav-links button').forEach(b => b.classList.remove('active'));
            const activeBtn = document.getElementById(`nav-btn-${categoryId}`);
            if(activeBtn) activeBtn.classList.add('active');

            const catData = siteData.categories.find(c => c.id === categoryId);
            const content = document.getElementById('app-content');
            
            // Renderizar Vista de Categoría
            let html = `
                <div class="page-view active-view" id="view-${catData.id}">
                    <div class="page-header">
                        <div>
                            <h1 class="page-title">${catData.title}</h1>
                            <p class="page-subtitle">${catData.subtitle}</p>
                        </div>
                        <button class="btn-add-product admin-only" onclick="openProductModal('${catData.id}')">+ NUEVO PRODUCTO</button>
                    </div>
                    <div class="products-grid" id="grid-${catData.id}">
            `;
            
            // Inyectar Productos
            const catProducts = siteData.products.filter(p => p.category === catData.id);
            catProducts.forEach(prod => {
                let sizesHtml = prod.sizes.map(s => `<span class="size-badge">${s}</span>`).join('');
                html += `
                    <div class="product-card">
                        <img src="${prod.image}" class="product-img">
                        <div class="product-title">${prod.title}</div>
                        <div class="product-price">${prod.price}</div>
                        <div class="product-sizes">${sizesHtml}</div>
                        <button style="background:#000; color:#fff; border:none; padding:10px; font-weight:bold; cursor:pointer; margin-top:auto;">Agregar al Carrito</button>
                    </div>
                `;
            });

            html += `</div></div>`;
            content.innerHTML = html;

            // Sincronizar el panel de admin si está abierto
            const selector = document.getElementById('tab-selector');
            if(selector && selector.querySelector(`option[value="${categoryId}"]`)) {
                selector.value = categoryId;
                loadTabSettings();
            }
        }

        // --- 5. LÓGICA DEL PANEL OMEGA ---
        function adjustHeader() {
            const size = document.getElementById('edit-logo-size').value;
            const logo = document.getElementById('logo-trigger');
            const header = document.getElementById('main-header');
            logo.style.height = size + 'px';
            const padding = Math.max(5, 15 - (size - 45) * 0.15); // Compensa márgenes
            header.style.padding = `${padding}px 40px`;
        }

        function renderAdminTabs() {
            const selector = document.getElementById('tab-selector');
            selector.innerHTML = '';
            siteData.categories.forEach(cat => {
                selector.innerHTML += `<option value="${cat.id}">${cat.name}</option>`;
            });
            loadTabSettings();
        }

        function loadTabSettings() {
            const catId = document.getElementById('tab-selector').value;
            const catData = siteData.categories.find(c => c.id === catId);
            if(catData) {
                document.getElementById('edit-tab-name').value = catData.name;
                document.getElementById('edit-page-title').value = catData.title;
                document.getElementById('edit-page-subtitle').value = catData.subtitle;
                document.getElementById('edit-page-layout').value = catData.layout || 'cards';
            }
        }

        function saveAllSettings() {
            // Guardar configuración de pestaña
            const catId = document.getElementById('tab-selector').value;
            const catIndex = siteData.categories.findIndex(c => c.id === catId);
            
            if(catIndex > -1) {
                siteData.categories[catIndex].name = document.getElementById('edit-tab-name').value;
                siteData.categories[catIndex].title = document.getElementById('edit-page-title').value;
                siteData.categories[catIndex].subtitle = document.getElementById('edit-page-subtitle').value;
                siteData.categories[catIndex].layout = document.getElementById('edit-page-layout').value;
            }

            localStorage.setItem('phenom_omega_data', JSON.stringify(siteData));
            alert('¡Configuración guardada y persistida!');
            renderNavigation();
            switchTab(catId);
        }

        // --- 6. GESTIÓN DE PRODUCTOS ---
        function openProductModal(categoryId) {
            document.getElementById('prod-category').value = categoryId;
            document.getElementById('prod-title').value = '';
            document.getElementById('prod-price').value = '';
            document.getElementById('prod-img-file').value = '';
            document.querySelectorAll('.size-chk').forEach(chk => chk.checked = false);
            document.getElementById('product-modal').classList.add('active');
        }

        function closeProductModal() {
            document.getElementById('product-modal').classList.remove('active');
        }

        function saveProduct() {
            const category = document.getElementById('prod-category').value;
            const title = document.getElementById('prod-title').value;
            const price = document.getElementById('prod-price').value;
            const fileInput = document.getElementById('prod-img-file');
            
            let sizes = [];
            document.querySelectorAll('.size-chk:checked').forEach(chk => sizes.push(chk.value));

            if(!title || !price || !fileInput.files[0]) {
                alert("Completa título, precio e imagen.");
                return;
            }

            // Comprimir y guardar
            compressImage(fileInput.files[0], function(base64Img) {
                siteData.products.push({
                    id: Date.now(),
                    category: category,
                    title: title,
                    price: price,
                    image: base64Img,
                    sizes: sizes
                });
                
                localStorage.setItem('phenom_omega_data', JSON.stringify(siteData));
                closeProductModal();
                switchTab(category); // Recargar la vista actual
            });
        }

        // --- INICIALIZACIÓN ---
        window.onload = () => {
            renderNavigation();
            switchTab('inicio');
        };
    </script>
</body>
</html>
